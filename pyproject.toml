[project]
name = "vdm10-python"
version = "0.1.5"
description = "Python library and indoor-station simulator for Metzler/Hikvision VDM10 SIP intercoms"
readme = "README.md"
authors = [
    { name = "lodzen", email = "dalodzik@googlemail.com" }
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["sip", "voip", "intercom", "doorbell", "hikvision", "metzler", "vdm10", "rtsp", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Telephony",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=44",
]

[project.urls]
Repository = "https://github.com/lodzen/metzler-vdm10"
Documentation = "https://github.com/lodzen/metzler-vdm10/tree/main/docs"
Issues = "https://github.com/lodzen/metzler-vdm10/issues"

[project.scripts]
metzler = "metzler:main"
indoor-station = "metzler.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# dist name is vdm10-python but the import package stays `metzler`
module-name = "metzler"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: spawns the simulator as a subprocess on localhost"]

[dependency-groups]
dev = [
    "pytest>=9.1,<9.2",
    "ruff>=0.17.3,<0.18",
    "ty>=0.0.107,<0.1",
]
docs = [
    "sphinx==9.1.0",
    "sphinxcontrib-websupport==2.0.0",
    "sphinx-rtd-theme==3.1.0",
    "myst-parser>=5,<6",
    "sphinxcontrib-mermaid>=2,<3",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "E701",   # deliberate compact style: one-line if/try bodies
    "E702",   # deliberate compact style: semicolon-separated statements
    "E731",   # deliberate compact style: lambdas assigned to names
    "SIM105", # try/except/pass one-liners preferred over contextlib.suppress
]

[tool.ruff.lint.isort]
known-first-party = ["metzler"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
root = ["./src", "./tests", "./tools"]

# IndoorStation is assembled from mixins that share `self`; each mixin
# references attributes defined by its siblings, which is uncheckable. The
# optional SipProvider/FritzTrunk legs are guarded at runtime but ty sees
# the `X | None` union - same class of uncheckable internals.
[[tool.ty.overrides]]
include = ["src/metzler/station/**"]

[tool.ty.overrides.rules]
missing-attribute = "ignore"
missing-union-attribute = "ignore"
